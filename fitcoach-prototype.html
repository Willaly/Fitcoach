        #050505;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }
    .phone {
      box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06), inset 0 0 0 1px rgba(255,255,255,0.03);
      background: #050505;
    }
    .scrollbar-hidden::-webkit-scrollbar { display: none; }
    .scrollbar-hidden { scrollbar-width: none; -ms-overflow-style: none; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.5; }
      70% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }
    .ping-dot { position: relative; }
    .ping-dot::before {
      content: ''; position: absolute; inset: -2px; border-radius: 9999px;
      background: currentColor; animation: pulse-ring 1.6s infinite ease-out;
    }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(163,230,53,0.15), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }
    .gradient-lime { background: linear-gradient(135deg, #d9f99d 0%, #84cc16 100%); }
    .gradient-text { background: linear-gradient(135deg, #d9f99d 0%, #84cc16 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
    .gradient-fire { background: linear-gradient(135deg, #fb923c 0%, #ef4444 100%); }
    input[type=range].lime { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 9999px; background: #1f1f1f; outline: none; }
    input[type=range].lime::-webkit-slider-thumb {
      -webkit-appearance: none; height: 24px; width: 24px; border-radius: 9999px;
      background: #a3e635; border: 3px solid #1a2e0a;
      cursor: pointer; box-shadow: 0 4px 12px rgba(163,230,53,0.4);
    }
    input[type=range].lime::-moz-range-thumb {
      height: 24px; width: 24px; border-radius: 9999px;
      background: #a3e635; border: 3px solid #1a2e0a;
      cursor: pointer; box-shadow: 0 4px 12px rgba(163,230,53,0.4);
    }
    .glass { background: rgba(20,20,20,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .tap-area { -webkit-tap-highlight-color: transparent; }
    button:focus, input:focus { outline: none; }
    @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fade-in 0.2s ease-out; }
    @keyframes scale-in { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .scale-in { animation: scale-in 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
  </style>
</head>

    const LineChart = ({ data = [], goal, height = 140, color = "#a3e635" }) => {

      const max = Math.max(...data) + 0.5;
      const min = Math.min(...data, goal || data[data.length - 1]) - 0.5;
      const x = (i) => pad + (i * (W - pad * 2)) / (data.length - 1);

          <Icon name="search" size={16} className="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500" />
          <input placeholder="Rechercher..." className="w-full h-12 bg-zinc-900 border border-white/5 rounded-2xl pl-11 pr-4 text-sm" />
        </div>
        <div className="space-y-1">
          {ATHLETES.slice(0, 6).map((a, i) => (
            <button key={a.id} onClick={openChat} className="w-full p-3 rounded-2xl flex items-center gap-3 tap-area hover:bg-white/5">
              <div className="relative">
                <Avatar n={a.avatar} size={48} />
                {i < 2 && <span className="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-emerald-400 border-2 border-zinc-950"></span>}
              </div>
              <div className="flex-1 min-w-0 text-left">
                <div className="flex items-center justify-between">
                  <div className="text-sm font-semibold truncate">{a.name}</div>
                  <div className="text-[10px] text-zinc-500 shrink-0">{["09:25","08:42","Hier","Hier","Lun","Dim"][i]}</div>
                </div>
                <div className="flex items-center gap-2 mt-0.5">
                  <div className={cls("text-xs truncate", i < 2 ? "text-white" : "text-zinc-500")}>
                    {["Pas de souci, je te propose un swap...","Top, j'ai battu mon record sur Fran","Merci pour les conseils !","Je vais essayer cette semaine","Question rapide sur les macros","Photos envoyées 📸"][i]}
                  </div>
                  {i === 0 && <Pill className="bg-lime-400 text-zinc-950 ml-auto shrink-0">2</Pill>}
                </div>
              </div>
            </button>
          ))}
        </div>
      </div>
    );

    /* =========================================================
       COACH — SETTINGS
       ========================================================= */
    const CoachSettings = ({ logout }) => (
      <div className="px-5 pt-3 pb-6 space-y-4">
        <h1 className="text-2xl font-bold">Paramètres</h1>
        <Card className="p-5">
          <div className="flex items-center gap-4">
            <Avatar n={68} size={64} ring />
            <div>
              <div className="text-lg font-bold">Maxime Durand</div>
              <div className="text-xs text-zinc-400">Coach · Box CrossFit Lyon</div>
              <Pill className="bg-lime-400/10 text-lime-400 mt-1.5">Plan Coach Pro</Pill>
            </div>
          </div>
        </Card>
        <SettingsGroup title="Mon activité">
          <SettingRow icon="users" label="Athlètes maximum" value="50" />
          <SettingRow icon="bell" label="Alertes & notifications" value="" />
          <SettingRow icon="clipboard" label="Modèles de feedback" value="6 actifs" />
        </SettingsGroup>
        <SettingsGroup title="Programmes">
          <SettingRow icon="target" label="Programmes 90 jours" value="3 actifs" />
          <SettingRow icon="utensils" label="Plans nutrition" value="" />
          <SettingRow icon="bolt" label="Défis communauté" value="1 actif" />
        </SettingsGroup>
        <SettingsGroup title="Compte">
          <SettingRow icon="crown" label="Abonnement Coach" value="Pro" />
          <SettingRow icon="settings" label="Paramètres" />
          <SettingRow icon="info" label="Aide" />
        </SettingsGroup>
        <button onClick={logout} className="w-full h-12 rounded-2xl border border-red-500/30 bg-red-500/5 text-red-400 text-sm font-semibold flex items-center justify-center gap-2"><Icon name="logout" size={16} /> Se déconnecter</button>
      </div>
    );

    /* =========================================================
       PRICING + STRIPE-LIKE CHECKOUT
       ========================================================= */
    const Pricing = ({ back, onSelect }) => (
      <div className="px-5 pt-3 pb-6">
        <div className="flex items-center justify-between mb-4">
          <button onClick={back} className="p-2 -ml-2"><Icon name="chevL" /></button>
          <div className="text-sm font-semibold">Plans & abonnement</div>
          <div className="w-9"></div>
        </div>
        <div className="text-center mb-6">
          <h1 className="text-3xl font-bold">Choisis ton <span className="gradient-text">niveau</span></h1>
          <p className="text-sm text-zinc-400 mt-2">Annulable à tout moment, sans engagement</p>
        </div>
        <div className="space-y-3">
          {PRICING_PLANS.map(p => (
            <Card key={p.id} className={cls("p-5 relative", p.popular && "ring-2 ring-lime-400/40")}>
              {p.popular && <Pill className="absolute -top-2 left-5 bg-lime-400 text-zinc-950">★ Le plus populaire</Pill>}
              <div className="flex items-baseline justify-between">
                <div className="text-lg font-bold">{p.name}</div>
                <div className="text-3xl font-bold">{p.price}€<span className="text-sm text-zinc-500 font-normal"> / mois</span></div>
              </div>
              <ul className="mt-4 space-y-2">
                {p.features.map(f => (
                  <li key={f} className="flex items-center gap-2 text-sm text-zinc-300">
                    <div className="w-5 h-5 rounded-full bg-lime-400/15 flex items-center justify-center shrink-0"><Icon name="check" size={12} className="text-lime-400" strokeWidth={3} /></div>
                    {f}
                  </li>
                ))}
              </ul>
              <Btn size="md" variant={p.popular ? "primary" : "ghost"} className="w-full mt-5" onClick={() => onSelect(p)}>
                {p.popular ? "Démarrer mon essai 7j" : "Choisir"}
              </Btn>
            </Card>
          ))}
        </div>
        <div className="mt-6 text-center text-[11px] text-zinc-500">
          <div className="flex items-center justify-center gap-2 mb-2">
            <Icon name="lock" size={12} /> Paiement sécurisé · Powered by Stripe
          </div>
          <div>TVA incluse · Facture envoyée par email</div>
        </div>
      </div>
    );

    const StripeCheckout = ({ plan, close, onSuccess }) => {
      const [card, setCard] = useState("4242 4242 4242 4242");
      const [exp, setExp] = useState("12 / 28");
      const [cvc, setCvc] = useState("123");
      const [name, setName] = useState("Sophie Martin");
      const [loading, setLoading] = useState(false);
      const [success, setSuccess] = useState(false);
      const submit = () => {
        setLoading(true);
        setTimeout(() => { setLoading(false); setSuccess(true); setTimeout(onSuccess, 1500); }, 1800);
      };
      return (
        <div className="absolute inset-0 z-40 flex items-end fade-in">
          <div className="absolute inset-0 bg-black/70" onClick={close}></div>
          <div className="relative bg-zinc-950 w-full rounded-t-3xl border-t border-white/10 slide-up max-h-[90%] overflow-y-auto scrollbar-hidden">
            <div className="sticky top-0 bg-zinc-950 z-10 px-5 pt-3 pb-2 flex items-center justify-between border-b border-white/5">
              <button onClick={close} className="text-sm text-zinc-400">Annuler</button>
              <div className="text-xs font-semibold text-zinc-300">Paiement sécurisé</div>
              <div className="w-12"></div>
            </div>

            {success ? (
              <div className="px-6 py-12 text-center">
                <div className="w-20 h-20 rounded-full gradient-lime mx-auto flex items-center justify-center mb-4 scale-in"><Icon name="check" size={40} className="text-zinc-950" strokeWidth={4} /></div>
                <h3 className="text-2xl font-bold">Paiement validé 🎉</h3>
                <p className="text-zinc-400 mt-2">Bienvenue dans <strong className="text-white">FitCoach {plan.name}</strong></p>
              </div>
            ) : (
              <>
                <div className="px-5 pt-5">
                  <div className="text-xs text-zinc-400">Tu t'abonnes à</div>
                  <div className="flex items-center justify-between mt-1">
                    <div>
                      <div className="text-lg font-bold">FitCoach {plan.name}</div>
                      <div className="text-[11px] text-lime-400">7 jours d'essai gratuit, puis…</div>
                    </div>
                    <div className="text-2xl font-bold">{plan.price}€<span className="text-xs text-zinc-500">/mois</span></div>
                  </div>
                </div>

                <div className="px-5 mt-5 space-y-3">
                  <div>
                    <label className="text-[11px] text-zinc-500 uppercase tracking-wider">Email</label>
                    <input defaultValue="sophie.martin@gmail.com" className="w-full h-12 bg-zinc-900 border border-white/5 rounded-2xl px-4 text-sm mt-1" />
                  </div>
                  <div>
                    <label className="text-[11px] text-zinc-500 uppercase tracking-wider">Informations carte</label>
                    <div className="mt-1 rounded-2xl border border-white/5 overflow-hidden">
                      <div className="relative">
                        <input value={card} onChange={e => setCard(e.target.value)} placeholder="1234 1234 1234 1234" className="w-full h-12 bg-zinc-900 px-4 pr-16 text-sm" />
                        <div className="absolute right-3 top-1/2 -translate-y-1/2 flex gap-1">
                          <div className="w-7 h-5 rounded bg-gradient-to-r from-blue-600 to-blue-500"></div>
                          <div className="w-7 h-5 rounded bg-gradient-to-r from-red-500 via-orange-400 to-yellow-400"></div>
                        </div>
                      </div>
                      <div className="grid grid-cols-2 border-t border-white/5">
                        <input value={exp} onChange={e => setExp(e.target.value)} placeholder="MM / AA" className="h-12 bg-zinc-900 px-4 text-sm border-r border-white/5" />
                        <input value={cvc} onChange={e => setCvc(e.target.value)} placeholder="CVC" className="h-12 bg-zinc-900 px-4 text-sm" />
                      </div>
                    </div>
                  </div>
                  <div>
                    <label className="text-[11px] text-zinc-500 uppercase tracking-wider">Nom sur la carte</label>
                    <input value={name} onChange={e => setName(e.target.value)} className="w-full h-12 bg-zinc-900 border border-white/5 rounded-2xl px-4 text-sm mt-1" />
                  </div>
                  <div>
                    <label className="text-[11px] text-zinc-500 uppercase tracking-wider">Pays</label>
                    <select className="w-full h-12 bg-zinc-900 border border-white/5 rounded-2xl px-4 text-sm mt-1 appearance-none">
                      <option>France</option><option>Belgique</option><option>Suisse</option><option>Canada</option>
                    </select>
                  </div>
                </div>

                <div className="px-5 mt-5 pb-3">
                  <div className="flex items-start gap-2 text-[11px] text-zinc-400 mb-3">
                    <Icon name="lock" size={12} className="mt-0.5 shrink-0" />
                    <span>Tu seras débité de <strong className="text-white">0€</strong> aujourd'hui. Ton essai gratuit de 7 jours commence maintenant. Tu peux annuler à tout moment depuis ton profil.</span>
                  </div>
                </div>

                <div className="sticky bottom-0 bg-zinc-950 border-t border-white/5 px-5 py-4">
                  <Btn size="lg" className="w-full" onClick={submit} disabled={loading}>
                    {loading ? <span className="flex items-center gap-2"><span className="w-4 h-4 border-2 border-zinc-950/30 border-t-zinc-950 rounded-full animate-spin"></span> Paiement en cours...</span> : `Démarrer mon essai · ${plan.price}€ / mois après`}
                  </Btn>
                  <div className="text-center text-[10px] text-zinc-600 mt-3 flex items-center justify-center gap-1.5">Powered by <span className="font-semibold text-zinc-400">stripe</span></div>
                </div>
              </>
            )}
          </div>
        </div>
      );
    };

    /* =========================================================
       APP ROOT
       ========================================================= */
    const ATHLETE_TABS = [
      { key: "home", label: "Accueil", icon: "home" },
      { key: "history", label: "Progrès", icon: "chart" },
      { key: "checkin", label: "Check-in", icon: "target" },
      { key: "messages", label: "Coach", icon: "msg" },
      { key: "profile", label: "Profil", icon: "settings" },
    ];

    const COACH_TABS = [
      { key: "home", label: "Vue", icon: "home" },
      { key: "athletes", label: "Athlètes", icon: "users" },
      { key: "alerts", label: "Alertes", icon: "alert" },
      { key: "messages", label: "Messages", icon: "msg" },
      { key: "settings", label: "Réglages", icon: "settings" },
    ];

    const App = () => {
      const [view, setView] = useState("login");
      const [role, setRole] = useState("athlete");
      const [tab, setTab] = useState("home");
      const [openAthleteId, setOpenAthleteId] = useState(null);
      const [extraScreen, setExtraScreen] = useState(null);
      const [notifsOpen, setNotifsOpen] = useState(false);
      const [pricingOpen, setPricingOpen] = useState(false);
      const [checkout, setCheckout] = useState(null);
      const [tabsHidden, setTabsHidden] = useState(false);

      const switchRole = (r) => { setRole(r); setView("home"); setTab("home"); setOpenAthleteId(null); setExtraScreen(null); };

      const renderAthlete = () => {
        if (extraScreen === "daily") return <DailyTracking back={() => setExtraScreen(null)} onValidate={() => setExtraScreen(null)} />;
        if (extraScreen === "weekly") return <WeeklyCheckin back={() => setExtraScreen(null)} />;
        if (extraScreen === "history") return <ProgressHistory back={() => setExtraScreen(null)} />;
        if (extraScreen === "program") return <Program />;
        if (extraScreen === "community") return <Community />;
        if (extraScreen === "messages") return <Messages back={() => setExtraScreen(null)} />;
        switch (tab) {
          case "home": return <AthleteHome go={(s) => setExtraScreen(s)} openNotifs={() => setNotifsOpen(true)} />;
          case "history": return <ProgressHistory back={() => setTab("home")} />;
          case "checkin": return <WeeklyCheckin back={() => setTab("home")} />;
          case "messages": return <Messages back={() => setTab("home")} />;
          case "profile": return <Profile openPricing={() => setPricingOpen(true)} logout={() => setView("login")} />;
          default: return null;
        }
      };

      const renderCoach = () => {
        if (openAthleteId && extraScreen === "checkin") return <CheckinReview back={() => setExtraScreen(null)} />;
        if (openAthleteId && extraScreen === "message") return <Messages back={() => setExtraScreen(null)} />;
        if (openAthleteId) return <AthleteDetail id={openAthleteId} back={() => setOpenAthleteId(null)} openCheckin={() => setExtraScreen("checkin")} openMessage={() => setExtraScreen("message")} />;
        switch (tab) {
          case "home": return <CoachHome go={setTab} openAthlete={(id) => setOpenAthleteId(id)} />;
          case "athletes": return <AthleteList openAthlete={(id) => setOpenAthleteId(id)} />;
          case "alerts": return <Alerts openAthlete={(id) => { setTab("athletes"); setOpenAthleteId(id); }} />;
          case "messages": return <CoachMessages openChat={() => setExtraScreen("chat")} />;
          case "settings": return <CoachSettings logout={() => setView("login")} />;
          default: return null;
        }
      };

      // Determine TabBar visibility
      const showTabBar = view === "home" && (
        (role === "athlete" && !["daily","weekly"].includes(extraScreen)) ||
        (role === "coach" && !openAthleteId && extraScreen !== "chat")
      );
      const inExtra = extraScreen === "messages" || (role === "coach" && extraScreen === "chat");

      const tabBar = role === "athlete"
        ? <TabBar items={ATHLETE_TABS} value={tab} onChange={(k) => { setTab(k); setExtraScreen(null); setOpenAthleteId(null); }} />
        : <TabBar items={COACH_TABS} value={tab} onChange={(k) => { setTab(k); setExtraScreen(null); setOpenAthleteId(null); }} />;

      return (
        <div className="min-h-screen flex flex-col">
          {/* Demo controls */}
          <div className="sticky top-0 z-50 px-4 py-3 border-b border-white/5 backdrop-blur-xl bg-black/60">
            <div className="max-w-5xl mx-auto flex items-center justify-between gap-4 flex-wrap">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-lg gradient-lime flex items-center justify-center"><Icon name="bolt" size={16} className="text-zinc-950" strokeWidth={3} /></div>
                <div>
                  <div className="font-bold text-sm leading-tight">FitCoach <span className="text-zinc-500 font-normal">— Prototype</span></div>
                  <div className="text-[10px] text-zinc-500">Mobile-first · Dark · FR</div>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <div className="hidden md:flex items-center gap-1 p-1 bg-zinc-900 rounded-xl border border-white/5">
                  <button onClick={() => switchRole("athlete")} className={cls("h-8 px-3 rounded-lg text-xs font-semibold flex items-center gap-1.5", role === "athlete" ? "bg-lime-400 text-zinc-950" : "text-zinc-400")}><Icon name="bolt" size={12} /> Athlète</button>
                  <button onClick={() => switchRole("coach")} className={cls("h-8 px-3 rounded-lg text-xs font-semibold flex items-center gap-1.5", role === "coach" ? "bg-lime-400 text-zinc-950" : "text-zinc-400")}><Icon name="users" size={12} /> Coach</button>
                </div>
                <button onClick={() => setView("login")} className="hidden md:flex h-9 px-3 rounded-xl bg-zinc-900 border border-white/5 text-xs font-semibold items-center gap-1.5"><Icon name="logout" size={12} /> Login</button>
                <button onClick={() => setPricingOpen(true)} className="hidden md:flex h-9 px-3 rounded-xl bg-zinc-900 border border-white/5 text-xs font-semibold items-center gap-1.5"><Icon name="crown" size={12} /> Pricing</button>
              </div>
            </div>
            <div className="flex md:hidden items-center justify-center gap-1 mt-3 p-1 bg-zinc-900 rounded-xl border border-white/5">
              <button onClick={() => switchRole("athlete")} className={cls("flex-1 h-8 rounded-lg text-xs font-semibold", role === "athlete" ? "bg-lime-400 text-zinc-950" : "text-zinc-400")}>Athlète</button>
              <button onClick={() => switchRole("coach")} className={cls("flex-1 h-8 rounded-lg text-xs font-semibold", role === "coach" ? "bg-lime-400 text-zinc-950" : "text-zinc-400")}>Coach</button>
              <button onClick={() => setView("login")} className="h-8 px-3 rounded-lg text-xs font-semibold text-zinc-400">Login</button>
              <button onClick={() => setPricingOpen(true)} className="h-8 px-3 rounded-lg text-xs font-semibold text-zinc-400">€</button>
            </div>
          </div>

          {/* Phone */}
          <div className="flex-1 flex items-start justify-center py-6 md:py-10 px-4">
            <PhoneFrame
              tabBar={view === "home" && showTabBar && !inExtra ? tabBar : null}
              hideTabBar={view !== "home" || !showTabBar || inExtra}
            >
              <div className="relative">
                {view === "login" && <Login onLogin={() => { setView("home"); setTab("home"); setExtraScreen(null); setOpenAthleteId(null); }} onSignup={() => setView("onboarding")} />}
                {view === "onboarding" && <Onboarding onDone={() => { setView("home"); setRole("athlete"); }} />}
                {view === "home" && (role === "athlete" ? renderAthlete() : renderCoach())}
                {notifsOpen && <NotifPanel close={() => setNotifsOpen(false)} />}
                {pricingOpen && !checkout && (
                  <div className="absolute inset-0 z-30 bg-zinc-950 fade-in overflow-y-auto scrollbar-hidden">
                    <Pricing back={() => setPricingOpen(false)} onSelect={(p) => setCheckout(p)} />
                  </div>
                )}
                {pricingOpen && checkout && <StripeCheckout plan={checkout} close={() => setCheckout(null)} onSuccess={() => { setCheckout(null); setPricingOpen(false); }} />}
              </div>
            </PhoneFrame>
          </div>

          <div className="max-w-5xl mx-auto px-4 pb-8 text-center text-xs text-zinc-500">
            <div>Prototype cliquable · Données mockées · Aucun backend connecté</div>
            <div className="mt-1">Stripe checkout : carte test <span className="font-mono text-zinc-400">4242 4242 4242 4242</span> · n'importe quel CVC / date future</div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
